# Build the repository with Jekyll and deploy it to GitHub Pages.
# Pull requests build the site (catching broken Markdown/Liquid) but never deploy.
name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; each job asks for only what it needs.
permissions: {}

# Deploys share one queue (never cancelled mid-flight; a newer push supersedes a
# waiting one). PR builds get their own group and cancel stale runs.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the live Pages settings, so PR builds skip it and stay independent of them.
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

      - name: Summarize build
        run: |
          {
            echo "### Site build"
            echo "| Pages | Size | Base path |"
            echo "| --- | --- | --- |"
            echo "| $(find _site -name '*.html' | wc -l) | $(du -sh _site | cut -f1) | \`${BASE_PATH:-/}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summarize deployment
        run: echo "### Deployed to ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
